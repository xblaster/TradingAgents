# Copy to desk.toml and pass with --config desk.toml. Every key is optional.

debate_rounds = 1
lookback_days = 400
web_search = true          # live mode only
language = "French"
results_dir = "results"

[llm]
command = "claude"
fast_model = "sonnet"      # analysts + debaters; aliases track the latest model
deep_model = "opus"        # risk manager + portfolio manager
fallback_model = "sonnet"
timeout_s = 300
max_retries = 2
max_concurrency = 4
cache_dir = ".desk_cache/llm"
knowledge_cutoff = 2026-06-30  # models' training cutoff: backtests after it are uncontaminated

[risk]
max_position_pct = 20      # hard cap, % of portfolio
min_conviction = 0.55      # below this, any trade becomes HOLD
max_stop_distance_pct = 15
default_stop_distance_pct = 8
